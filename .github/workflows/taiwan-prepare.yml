name: Prepare Taiwan Sponsor research data

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: '台股代碼，以逗號分隔'
        required: true
        default: '2330,3017,3231'
        type: string
      start:
        description: '資料起日 YYYY-MM-DD（建議至少一年）'
        required: true
        type: string
      as_of:
        description: '分析日期 YYYY-MM-DD（不得在未來）'
        required: true
        type: string
      mops_publications:
        description: '取得 MOPS 正式公布時間（新數值版本僅從取得日可用）'
        default: true
        type: boolean
      extended:
        description: '增補估值、現金流、資產負債、還原價、新聞社群及官方交易日'
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    # Secrets are only used by the trusted default branch; never PR/fork-controlled code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install data-only dependencies (no secrets in environment)
        run: python -m pip install python-dotenv requests
      - name: Prepare evidence bundles with Sponsor Token
        id: prepare
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          RESEARCH_SYMBOLS: ${{ inputs.symbols }}
          RESEARCH_START: ${{ inputs.start }}
          RESEARCH_AS_OF: ${{ inputs.as_of }}
          MOPS_PUBLICATIONS: ${{ inputs.mops_publications }}
          EXTENDED_RESEARCH: ${{ inputs.extended }}
        run: |
          options=(--require-token --output-dir research-data --archive-dir research-data/vintages)
          if [ "$EXTENDED_RESEARCH" = "true" ]; then options+=(--extended --material-events); fi
          if [ "$MOPS_PUBLICATIONS" = "true" ]; then options+=(--mops-publications); fi
          python -m tradingagents.research prepare "${options[@]}"
      - name: Audit captured evidence without credentials
        if: steps.prepare.outcome == 'success'
        run: |
          options=(--output research-data/audit.json --require-complete)
          for file in research-data/*/snapshot.json; do options+=(--snapshot "$file"); done
          python -m tradingagents.research audit "${options[@]}"
      - name: Accept integrated research reports without credentials
        if: always() && steps.prepare.outcome == 'success' && inputs.extended
        run: |
          status=0
          for file in research-data/*/snapshot.json; do
            python -m tradingagents.research acceptance --snapshot "$file" --output-dir "$(dirname "$file")/integrated" || status=1
          done
          exit "$status"
      - name: Upload data packages (no Token, no Codex credentials)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: taiwan-research-data-${{ github.run_id }}
          path: research-data/
          retention-days: 1
          if-no-files-found: error
      - name: Surface data preparation failures
        if: steps.prepare.outcome != 'success'
        run: exit 1
