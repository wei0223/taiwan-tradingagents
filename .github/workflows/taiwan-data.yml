name: Taiwan data-only contracts

on:
  push:
    branches: [main, 'feature/taiwan-*']
  pull_request:

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only data-entry dependencies
        run: python -m pip install python-dotenv requests
      - name: Run offline provider tests (network blocked)
        run: python -m unittest discover -s tests/taiwan -v
